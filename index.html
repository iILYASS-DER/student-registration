
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
</head>

<body>

    <h1>Student Registration</h1>

    <p>Register now for our programming course.</p>

    <img src="image.png" alt="Programming Course" width="400">

    <h2>Registration Form</h2>

    <form>

        <!-- Full Name -->
        <label for="name">Full Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
        >
        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            required
        >
        <br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >
        <br><br>

        <!-- Age -->
        <label for="age">Age:</label>
        <input
            type="number"
            id="age"
            name="age"
            placeholder="Enter your age"
            required
        >
        <br><br>

        <!-- Birth Date -->
        <label for="birthdate">Birth Date:</label>
        <input
            type="date"
            id="birthdate"
            name="birthdate"
            required
        >
        <br><br>

        <!-- Phone -->
        <label for="phone">Phone Number:</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="06XXXXXXXX"
        >
        <br><br>

        <!-- Favorite Color -->
        <label for="color">Favorite Color:</label>
        <input
            type="color"
            id="color"
            name="color"
        >
        <br><br>

        <!-- Course -->
        <label for="course">Choose a Course:</label>

        <select id="course" name="course" required>
            <option value="">-- Choose a course --</option>
            <option value="html">HTML & CSS</option>
            <option value="python">Python Programming</option>
            <option value="javascript">JavaScript</option>
        </select>

        <br><br>

        <!-- Gender -->
        <p>Gender:</p>

        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <br><br>

        <!-- Skills -->
        <p>Skills:</p>

        <input type="checkbox" id="html-skill" name="skills" value="html">
        <label for="html-skill">HTML</label>

        <input type="checkbox" id="css-skill" name="skills" value="css">
        <label for="css-skill">CSS</label>

        <input type="checkbox" id="python-skill" name="skills" value="python">
        <label for="python-skill">Python</label>

        <br><br>

        <!-- Message -->
        <label for="message">Message:</label>
        <br>

        <textarea
            id="message"
            name="message"
            placeholder="Write your message here..."
            rows="5"
            cols="40"
        ></textarea>

        <br><br>

        <!-- CV -->
        <label for="cv">Upload your CV:</label>
        <input
            type="file"
            id="cv"
            name="cv"
        >

        <br><br>

        <!-- Buttons -->
        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>

</html>
